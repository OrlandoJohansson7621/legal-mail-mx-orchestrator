[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-mail-mx-orchestrator"
version = "0.1.0"
description = "Configure prioritized legal-mail MX records and inspect sending domains"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
